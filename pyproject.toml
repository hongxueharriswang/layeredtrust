[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layeredtrust"
version = "1.0.0"
description = "Unified Multi-Layer Trust Framework for Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harris Wang", email = "harriw@athabascau.ca" }]
keywords = ["trust", "multi-agent systems", "MAS", "Bayesian", "game theory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # pure standard library

[project.optional-dependencies]
dev = ["pytest>=7.0", "numpy>=1.24"]

[tool.setuptools]
py-modules = ["layeredtrust"]
